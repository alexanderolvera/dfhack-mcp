name: Release

# Cut a release by bumping package.json + server.json + CHANGELOG to the same
# version, then: git tag v1.0.0 && git push origin v1.0.0
#
# npm publishing uses TRUSTED PUBLISHING (OIDC) — no NPM_TOKEN. One-time setup on
# npmjs.com, needed again only if the package is ever recreated:
#   1. Publish once by hand (`npm publish --access public` under `npm login`) — a
#      trusted publisher can only be configured on a package that already exists.
#   2. In the package settings, add a Trusted Publisher pointing at this repo and
#      `.github/workflows/release.yml`.
#
# The MCP Registry needs no such bootstrap, but it validates ownership by fetching
# the npm tarball and checking its `mcpName` — hence mcp-registry needing publish.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Node 20 is the published floor. Packs the tarball and boots the PREBUILT bundle
  # clean-room, catching a broken dist that publish's source-level T0 can't see.
  verify-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Clean-room pack + install + MCP handshake
        run: npm run smoke:artifact

  publish:
    needs: verify-artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      # Trusted publishing needs npm >= 11.5.x; pinned exactly so a re-run months
      # later can't pull an npm major that drops Node 24 or changes publish behavior.
      - run: npm install -g npm@11.5.1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npm run verify:t0
      - name: Check tag matches package version
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME ($TAG) != package.json version $PKG"
            exit 1
          fi
      - name: Publish to npm
        run: npm publish --access public

  # mcp-registry and github-release are separate, dependent jobs so a failure in
  # either is re-runnable without re-attempting the immutable npm publish.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Check server.json versions match tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          SRV=$(jq -r '.version' server.json)
          PKG=$(jq -r '.packages[0].version' server.json)
          if [ "$SRV" != "$TAG" ] || [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME ($TAG) != server.json $SRV / package $PKG"
            exit 1
          fi
      # Pinned, not `latest`: the registry is in preview, so bump deliberately when
      # its server.json schema moves.
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.0/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
